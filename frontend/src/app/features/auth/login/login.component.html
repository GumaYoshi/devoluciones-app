<section class="login-contenedor">
  <div class="login-tarjeta">
    <div class="encabezado">
      <h1>DevolucionesApp</h1>
      <p>Gestión de solicitudes de devolución</p>
    </div>

    <div
      *ngIf="errorMensaje()"
      class="alerta alerta-error"
    >
      {{ errorMensaje() }}
    </div>

    <form
      [formGroup]="formulario"
      (ngSubmit)="ingresar()"
    >
      <div class="campo">
        <label for="username">Usuario</label>

        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Ingrese su usuario"
        >

        <small
          *ngIf="
            formulario.controls.username.touched &&
            formulario.controls.username.invalid
          "
          class="error-campo"
        >
          El usuario es obligatorio.
        </small>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>

        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Ingrese su contraseña"
        >

        <small
          *ngIf="
            formulario.controls.password.touched &&
            formulario.controls.password.invalid
          "
          class="error-campo"
        >
          La contraseña es obligatoria.
        </small>
      </div>

      <button
        type="submit"
        class="boton boton-primario boton-completo"
      >
        Ingresar
      </button>
    </form>

    <div class="usuarios-prueba">
      <strong>Usuarios de prueba</strong>

      <p>
        Analista:
        <code>analista1 / analista123</code>
      </p>

      <p>
        Supervisor:
        <code>supervisor1 / supervisor123</code>
      </p>
    </div>
  </div>
</section>
