spring:
  application:
    name: devoluciones

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devoluciones}
    username: ${DB_USER:devoluciones}
    password: ${DB_PASSWORD:Devoluciones2026Local}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: INFO
    com.gumayoshi.devoluciones: INFO

app:
  carga:
    max-filas: ${CARGA_MAX_FILAS:50000}